version: 2

seeds:
  - name: raw_events
    description: |
      원천 이벤트. 그레인은 (event_id, batch_id) 이다.
      한 이벤트가 뒤 배치에서 정정(restatement)되어 다시 들어올 수 있다.
    config:
      column_types:
        event_id: bigint
        event_ts: timestamp
        event_type: string
        user_id: string
        amount: decimal(10,2)
        batch_id: int
    columns:
      - name: event_id
        description: 이벤트 식별자. 배치를 가로지르면 중복될 수 있다.
        data_tests:
          - not_null
      - name: batch_id
        description: 적재 배치 번호.
        data_tests:
          - not_null

  - name: raw_event_types
    description: 이벤트 유형 마스터.
    config:
      column_types:
        event_type: string
        event_category: string
        is_billable: boolean
    columns:
      - name: event_type
        data_tests:
          - not_null
          - unique
