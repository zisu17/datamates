version: 2

unit_tests:
  - name: stg_events_normalizes_type_and_anonymous_user
    description: |
      event_type 은 소문자·trim 으로, 익명 센티널('ANONYMOUS')과 공백뿐인 user_id 는
      null 로 정규화되어야 한다.
      유닛 테스트는 실제 데이터가 아니라 고정 입력으로 모델의 변환 로직 자체를 검증한다.
    model: stg_events
    given:
      - input: ref('raw_events')
        rows:
          - {event_id: 1, event_ts: "2026-07-01 09:00:00", event_type: "  PURCHASE ", user_id: "u001", amount: 10.00, batch_id: 1}
          - {event_id: 2, event_ts: "2026-07-01 10:00:00", event_type: "Page_View", user_id: "ANONYMOUS", amount: 0.00, batch_id: 1}
          - {event_id: 3, event_ts: "2026-07-01 11:00:00", event_type: "login", user_id: "   ", amount: 0.00, batch_id: 1}
    expect:
      rows:
        - {event_id: 1, event_type: "purchase", user_id: "u001", event_date: "2026-07-01"}
        - {event_id: 2, event_type: "page_view", user_id: null, event_date: "2026-07-01"}
        - {event_id: 3, event_type: "login", user_id: null, event_date: "2026-07-01"}
