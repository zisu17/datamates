version: 2
models:
  - name: agg_daily_events
    description: "일자·유형별 이벤트 집계. 일일 운영 보고에 쓴다.\nAPI로 만든 첫 모델이라 배관 확인용을 겸한다."
    config:
      materialized: table
      tags:
        - datamates
        - 집계
    columns:
      - name: event_date
        description: 집계 기준 일자.
        meta:
          label: 이벤트 일자
      - name: event_type
        description: 정규화된 이벤트 유형.
        meta:
          label: 이벤트 유형
      - name: event_count
        description: 해당 일자·유형의 이벤트 수.
        meta:
          label: 이벤트 건수
      - name: user_count
        description: 중복 제거한 사용자 수. 익명은 제외된다.
        meta:
          label: 사용자 수
      - name: total_amount
        description: 환불(음수)이 포함된 합계.
        meta:
          label: 금액 합계
