version: 2

unit_tests:
  - name: fct_events_keeps_latest_batch_per_event
    description: |
      같은 event_id 가 여러 배치로 들어오면 batch_id 가 가장 큰 행만 남아야 한다.
      증분 모델이라 overrides 로 is_incremental() 을 false 로 고정해 최초 적재 경로를 검증한다.
      max_batch_id 도 함께 고정한다 — 유닛 테스트는 런타임 --vars 에 흔들리지 않고
      고정 입력으로 로직만 검증해야 한다.
    model: fct_events
    overrides:
      macros:
        is_incremental: false
      vars:
        max_batch_id: 999
    given:
      - input: ref('stg_events')
        rows:
          - {event_id: 1, event_ts: "2026-07-01 09:00:00", event_date: "2026-07-01", event_type: "purchase", user_id: "u001", amount: 10.00, batch_id: 1}
          - {event_id: 1, event_ts: "2026-07-01 09:00:00", event_date: "2026-07-01", event_type: "purchase", user_id: "u001", amount: 99.00, batch_id: 2}
          - {event_id: 2, event_ts: "2026-07-02 10:00:00", event_date: "2026-07-02", event_type: "refund", user_id: "u002", amount: -5.00, batch_id: 1}
      - input: ref('dim_event_types')
        rows:
          - {event_type: "purchase", event_category: "commerce", is_billable: true}
          - {event_type: "refund", event_category: "commerce", is_billable: true}
    expect:
      rows:
        - {event_id: 1, amount: 99.00, batch_id: 2, event_category: "commerce"}
        - {event_id: 2, amount: -5.00, batch_id: 1, event_category: "commerce"}
