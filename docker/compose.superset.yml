# Superset — 분석 화면의 시각화·질의 엔진.
#
# 기본 compose 와 **같은 프로젝트(datamates)** 로 묶인다. 항상 두 파일을 함께 넘긴다:
#
#   docker compose -f docker/compose.yml -f docker/compose.superset.yml up -d
#   docker compose -f docker/compose.yml -f docker/compose.superset.yml logs -f superset
#   docker compose -f docker/compose.yml -f docker/compose.superset.yml down
#
# 이 파일에 name: 을 두지 않는다 — compose.yml 의 name: datamates 를 그대로 쓴다.
# 프로젝트가 하나여야 네트워크(datamates_default)와 볼륨 접두사가 갈라지지 않는다.
#
# 기본 파일만 넘겨 `up` 하면 compose 가 여기 서비스들을 orphan 으로 «경고» 한다
# (지우지는 않는다). Superset 없이 웨어하우스만 다룰 때는 그 경고를 무시하면 된다.
#
# 웨어하우스(minio · iceberg-rest)는 같은 프로젝트의 기본 네트워크에 있으므로
# 서비스 이름으로 바로 부른다 — external 네트워크 선언이 필요 없다.
#
services:
  superset-db:
    image: postgres:16-alpine
    container_name: superset-db
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    volumes:
      - superset-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 5s
      timeout: 3s
      retries: 20

  superset-redis:
    image: redis:7-alpine
    container_name: superset-redis
    volumes:
      - superset-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 1회성 초기화. 메타DB 스키마 + 관리자 계정 + 역할 등록.
  # 이미 초기화된 볼륨에 다시 돌려도 안전하다 (db upgrade 는 멱등,
  # create-admin 은 중복이면 경고만 내므로 `|| true` 로 넘긴다).
  superset-init:
    # 스택 전체가 쓰는 단일 이미지다(docker/datamates/Dockerfile). Superset 은 그 안의
    # /opt/superset-venv 에 있으므로 실행 파일을 절대경로로 부른다 — 베이스가 Airflow 라
    # PATH 상의 python 은 Superset 을 모른다.
    #
    # ENTRYPOINT 를 덮는 이유: 베이스의 /entrypoint 는 airflow 하위 명령을 해석하는
    # 스크립트다. 여기서 그대로 두면 `bash -c ...` 를 airflow 명령으로 보려 든다.
    image: &image zisu17/datamates:1.0.0
    entrypoint: &entrypoint ["/usr/bin/dumb-init", "--"]
    container_name: superset-init
    depends_on:
      superset-db:
        condition: service_healthy
    environment: &superset-env
      SUPERSET_CONFIG_PATH: /opt/superset/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-datamates-dev-only-change-me}
      SUPERSET_METADB_URI: postgresql+psycopg2://superset:superset@superset-db:5432/superset
      SUPERSET_REDIS_HOST: superset-redis
      # 컨테이너 안에서는 서비스 이름으로 부른다 (호스트에서는 localhost:5432 / :9000).
      # DuckLake 카탈로그 — 웨어하우스의 스냅샷·스키마·파일 목록이 여기 있다.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-datamates}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datamates}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      DBT_SCHEMA: analytics
      # 플랫폼 미리보기와 차트의 시간대를 맞춘다.
      DATAMATES_DUCKDB_TIMEZONE: ${DATAMATES_DUCKDB_TIMEZONE:-Asia/Seoul}
      # 임베디드 SDK와 게스트 토큰 엔드포인트를 활성화한다.
      SUPERSET_EMBEDDED: ${SUPERSET_EMBEDDED:-1}
    volumes:
      # 설정 파일만 Python 경로에 마운트한다.
      - ./superset/superset_config.py:/opt/superset/pythonpath/superset_config.py:ro
    # 들여쓰기를 한 칸도 더 넣지 말 것.
    #
    # YAML folded scalar(>)는 «더 깊게 들여쓴 줄» 의 개행을 그대로 보존한다.
    # 그래서 아래처럼 쓰면 --username 이하가 별개 명령으로 쪼개진다:
    #
    #     superset fab create-admin
    #       --username admin          ← 개행이 남아 별도 명령이 된다
    #
    # 결과는 create-admin 이 인자 없이 실행돼 대화형 프롬프트로 빠지고,
    # 계정이 만들어지지 않은 채 || true 가 실패를 삼킨다.
    # 증상은 나중에 로그인 401 로만 드러나서 원인을 찾기 어렵다.
    #
    # 마지막 list-users 검증이 그 «조용한 실패» 를 막는다 — 계정이 없으면
    # init 컨테이너가 실패로 끝나고 superset 이 아예 뜨지 않는다.
    command: >
      bash -c "
      /opt/superset-venv/bin/superset db upgrade &&
      (/opt/superset-venv/bin/superset fab create-admin --username ${SUPERSET_ADMIN_USER:-admin} --firstname Data --lastname Mates --email admin@datamates.local --password ${SUPERSET_ADMIN_PASSWORD:-admin} || true) &&
      /opt/superset-venv/bin/superset init &&
      /opt/superset-venv/bin/superset fab list-users | grep -q '${SUPERSET_ADMIN_USER:-admin}' &&
      echo '초기화 완료 — 관리자 계정 확인됨'
      "

  superset:
    image: *image
    entrypoint: *entrypoint
    container_name: superset
    depends_on:
      superset-init:
        condition: service_completed_successfully
      superset-redis:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: *superset-env
    ports:
      # **127.0.0.1 에만 묶는다.** 사용자는 이 포트를 쓰지 않는다 —
      # 브라우저는 플랫폼(8000)의 /superset/* 만 부르고 그쪽이 중계한다.
      #
      # 그런데도 포트가 남아 있는 이유: 플랫폼 서버가 호스트에서 돌기 때문이다
      # (datamates/run.sh). 프록시가 여기로 붙어야 하므로 완전히 닫을 수 없다.
      # 0.0.0.0 → 127.0.0.1 로 좁혀 **다른 기기에서는 닿지 않게** 했다.
      # 플랫폼까지 컨테이너로 옮기면 이 두 줄을 지우고
      # SUPERSET_BASE_URL=http://superset:8088 로 바꾼다.
      - "127.0.0.1:8088:8088"
    volumes:
      - ./superset/superset_config.py:/opt/superset/pythonpath/superset_config.py:ro
    # 이미지의 부트스트랩 스크립트에 의존하지 않고 gunicorn 을 직접 부른다.
    # 워커마다 독립된 DuckDB 인스턴스를 사용한다.
    command: >
      /opt/superset-venv/bin/gunicorn
      --bind 0.0.0.0:8088
      --workers 4
      --worker-class gthread
      --threads 4
      --timeout 120
      --limit-request-line 0
      --limit-request-field_size 0
      "superset.app:create_app()"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  superset-db-data:
  superset-redis-data:
