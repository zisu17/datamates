# 로컬 데이터 플랫폼 — 저장(MinIO) + 카탈로그(Iceberg REST)
#
#   docker-compose up -d          # 기동
#   ./scripts/bootstrap_catalog.sh
#   docker-compose down           # 종료 (데이터는 볼륨에 남는다)
#
# 저장소를 로컬 파일시스템에서 MinIO(S3 호환)로 옮겼다. 그 결과 이전 구성에서 필요했던
# "컨테이너와 호스트가 동일한 절대경로를 봐야 한다"는 제약이 사라졌다.
# 테이블 메타데이터에 기록되는 경로가 s3://warehouse/... 이고, 엔드포인트는 클라이언트마다
# 따로 설정하기 때문이다 (컨테이너 → minio:9000, 호스트 Spark → localhost:9000).

# 프로젝트 이름을 고정한다. 지정하지 않으면 compose 가 «디렉터리 이름» 을 쓰는데,
# 그러면 저장소 폴더를 옮기거나 이름을 바꾸는 순간 볼륨 접두사가 달라져
# 웨어하우스(minio-data)와 Airflow 메타DB(airflow-home)가 통째로 새로 만들어진다.
name: datamates

services:
  # -------------------------------------------------------------------------
  # Postgres — 메타스토어 · Airflow 메타DB · Iceberg 카탈로그의 공용 백엔드.
  #
  # 셋 다 원래 SQLite 였다. 옮긴 이유는 각각 다르다.
  #   메타스토어  동시 쓰기가 늘면 SQLite 의 단일 writer 가 병목이 된다.
  #   Airflow     SQLite 는 SequentialExecutor 를 강제해 태스크가 한 줄로 돈다.
  #   Iceberg     동시 커밋이 SQLITE_BUSY 로 깨져 iceberg_write 풀로 직렬화해야 했다.
  #
  # 「컨테이너를 늘리지 않는다」는 원래 방침을 여기서 한 번 접는다. 셋을 한 인스턴스에
  # 모아 늘어나는 컨테이너는 하나뿐이다.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datamates}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datamates}
      # init.sql 이 DB 셋을 만든다. 기본 DB 는 접속용으로만 쓴다.
      POSTGRES_DB: postgres
    ports:
      # 호스트에서 도는 플랫폼 서버(datamates/run.sh)가 붙어야 하므로 포트를 연다.
      # 127.0.0.1 에 묶어 다른 기기에서는 닿지 않게 한다.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 데이터 디렉터리가 비어 있을 때만 실행된다.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # -d 로 DB 를 지정하지 않으면 기본 DB 를 보는데, init.sql 이 도는 도중에도
      # 그 DB 는 이미 떠 있어서 healthy 가 먼저 뜬다. 실제로 쓰는 DB 를 찍어야
      # 뒤따르는 서비스가 「DB 가 아직 없다」로 죽지 않는다.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datamates} -d iceberg"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 웹 콘솔
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 버킷 생성용 1회성 컨테이너. 완료 후 종료된다.
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/warehouse &&
      mc mb --ignore-existing local/landing &&
      echo '버킷 준비 완료: warehouse(Iceberg 테이블), landing(원천 CSV)'
      "

  iceberg-rest:
    # 기본 이미지는 SQLite JDBC 드라이버만 번들한다. Postgres 로 붙으려면
    # 드라이버를 더한 이미지가 필요하다 — docker/iceberg-rest/Dockerfile 참고.
    build:
      context: ./docker/iceberg-rest
    image: local/iceberg-rest-pg:1.10.1
    container_name: iceberg-rest
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      # HadoopFileIO(로컬 파일) → S3FileIO(오브젝트 스토리지)
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      # MinIO 는 가상호스트 스타일(bucket.host)을 쓰지 않으므로 path-style 이 필요하다.
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: us-east-1
      # 카탈로그 메타데이터(네임스페이스·테이블 포인터)는 Postgres 로 영속화한다.
      #
      # SQLite 였을 때는 동시 커밋이 SQLITE_BUSY 로 깨져서, 수집 태스크와 dbt build 를
      # Airflow 의 iceberg_write 풀 하나에 묶어 전역 직렬화해야 했다. Postgres 는
      # 행 단위 잠금이라 그 직렬화가 더는 필요 없다 — daggen 의 풀 설정 참고.
      CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg
      CATALOG_JDBC_USER: ${POSTGRES_USER:-datamates}
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-datamates}
      # 커넥션 풀. SQLite 때는 1로 묶어야 했다(writer 가 하나뿐이라 넓혀도 처리량이
      # 늘지 않는데 풀 안에서 서로 락을 기다리다 물렸다). Postgres 는 그 제약이 없다.
      #
      # 이름이 `clients` 인 것에 주의. CATALOG_JDBC_POOL__MAX__SIZE 는 `jdbc.pool-max-size`
      # 로 번역되는데 Iceberg 에 그런 설정이 없다. jdbc. 로 시작하는 값은 드라이버에
      # 그대로 넘어가고, 드라이버도 모르는 이름이라 **조용히 무시된다.**
      # 풀 크기는 Iceberg 의 CatalogProperties.CLIENT_POOL_SIZE, 즉 `clients` 다.
      CATALOG_CLIENTS: "8"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/v1/config"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------------
  # Airflow — 오케스트레이션. dbt 는 이미지 안 별도 venv(/opt/dbt-venv)에 있다.
  #
  # 컨테이너가 datamates_default 네트워크에 있으므로 MinIO·Iceberg REST 를 **서비스 이름**으로
  # 부른다. profiles.yml 의 엔드포인트가 env_var 로 파라미터화돼 있어서
  # 프로필 파일은 손대지 않고 환경변수만 바꿔 끼운다.
  # -------------------------------------------------------------------------
  airflow:
    # 스택 전체가 이 **한 이미지**를 쓴다(docker/datamates/Dockerfile).
    # Airflow, Data Mates, Superset 이 같은 이미지를 서로 다른 command 로 실행한다 —
    # 받을 것이 하나뿐이고, 세 쪽의 dbt·DuckDB 버전이 구조적으로 어긋날 수 없다.
    #
    # 이 서비스만 ENTRYPOINT 를 덮지 않는다. 베이스의 /entrypoint 가 `standalone` 을
    # airflow 하위 명령으로 해석해 주기 때문이다.
    #
    # build: 를 두지 않는 이유 — 그게 있으면 이미지가 없는 새 기기에서 `up` 이 pull 대신
    # 로컬 빌드를 시작한다. 에뮬레이션까지 걸리면 수십 분이라, 올려 둔 이미지를 받는 편이
    # 낫다. 다시 만들 일이 있으면 docs/SETUP.md 의 빌드 명령을 쓴다.
    image: &image zisu17/datamates:1.0.0
    container_name: airflow
    depends_on:
      minio:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # 메타DB 는 Postgres. SQLite 는 SequentialExecutor 를 강제해 태스크가 한 줄로
      # 돌았다 — Airflow 가 기동 때 조합을 검사해서 executor 만 바꾸면 거부한다.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER:-datamates}:${POSTGRES_PASSWORD:-datamates}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # LocalExecutor 는 스케줄러 프로세스가 태스크를 자식 프로세스로 띄운다.
      # DuckLake 이관으로 태스크마다 붙던 Spark JVM 이 사라져 상한 근거가
      # 「메모리」에서 「CPU」로 바뀌었다. VM 이 6 CPU 라 그 안에서 잡는다.
      AIRFLOW__CORE__PARALLELISM: "6"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "6"
      # Admin→Config 화면. 기본값 False 면 /api/v2/config 가 403 으로 막힌다.
      # non-sensitive-only 는 민감값(비밀번호·키)을 가리고 나머지만 노출한다.
      AIRFLOW__API__EXPOSE_CONFIG: "non-sensitive-only"

      # Data Mates API 가 파이프라인을 저장할 때마다 dags/ 에 DAG 파일을 새로 쓴다.
      # Airflow 3 기본값 300초로는 «저장했는데 실행이 안 된다»가 5분간 이어진다.
      # 여기서는 DAG 수가 적으니 15초로 줄여 저장 직후 바로 돌 수 있게 한다.
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "15"

      # --- dbt 가 컨테이너 안에서 볼 엔드포인트 ---
      # 호스트에서는 localhost:8181 / localhost:9000 이지만 여기서는 서비스 이름이다.
      ICEBERG_REST_URI: http://iceberg-rest:8181
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

      # dbt 프로젝트는 마운트한 저장소의 dbt/ 안에 있다.
      # DBT_PROJECT_DIR 이 있으면 어느 워킹디렉터리에서 dbt 를 불러도 찾는다.
      DBT_PROJECT_DIR: /opt/project/dbt
      DBT_PROFILES_DIR: /opt/project/dbt/profiles
      DBT_SCHEMA: analytics
      DBT_TARGET: local
      # 프로젝트를 읽기전용으로 마운트하므로 산출물은 컨테이너 쪽에 쓴다.
      # 호스트에서 돌린 dbt 의 target/ 과 섞이지 않는 효과도 있다.
      DBT_TARGET_PATH: /opt/airflow/dbt/target
      DBT_LOG_PATH: /opt/airflow/dbt/logs
      # 익명 사용 통계를 끄면 dbt 가 profiles 디렉터리에 .user.yml 을 쓰지 않는다.
      # (읽기전용 마운트라 쓰기를 시도하면 안 된다)
      DO_NOT_TRACK: "1"
      # DuckLake 카탈로그. 호스트에서는 localhost 지만 컨테이너에서는 서비스 이름이다 —
      # dbt 프로필·warehouse.py·ingest.py 가 모두 이 값들로 같은 카탈로그에 붙는다.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-datamates}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datamates}
    volumes:
      - ./dags:/opt/airflow/dags
      # 프로젝트는 읽기전용. 컨테이너가 호스트 파일을 건드리지 못하게 한다.
      # 호스트의 .venv(macOS 바이너리)도 딸려오지만 쓰지 않는다.
      - ./:/opt/project:ro
      # dbt 프로젝트는 이 저장소 밖에 있을 수 있다(DBT_PROJECT_DIR). 컨테이너 안의
      # 같은 자리에 따로 걸어 준다 — 이게 없으면 Airflow 가 돌리는 dbt 가
      # dbt_project.yml 을 못 찾아 파이프라인 실행만 조용히 실패한다.
      - ${DBT_PROJECT_DIR:-./dbt}:/opt/project/dbt:ro
      - airflow-home:/opt/airflow
      # dbt 실행 산출물(run_results.json)을 호스트에서 읽기 위한 통로.
      # Data Mates API 가 모델별 상태·소요·행수를 여기서 읽는다. Airflow 의 태스크 상태만으로는
      # "몇 건 처리했는지"를 알 수 없어서 dbt 쪽 산출물이 따로 필요하다.
      - ./.datamates/runs:/opt/datamates/runs
    command: standalone
    healthcheck:
      # 두 가지를 함께 본다. API 서버가 듣고 있는지(-o /dev/null 이라 401 도 통과다 —
      # 여기서 알고 싶은 것은 «연결이 되는가»뿐이다), 그리고 admin 비밀번호 파일이
      # 만들어졌는지. 후자가 필요한 이유는 datamates 컨테이너가 그 파일을 읽어
      # 인증하기 때문이다. 파일은 메타DB 초기화와 계정 생성이 끝난 뒤에 나온다.
      test: ["CMD-SHELL", "test -f /opt/airflow/simple_auth_manager_passwords.json.generated && curl -s -o /dev/null http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 5s
      # 첫 기동은 메타DB 마이그레이션까지 하므로 넉넉히 준다.
      start_period: 90s
      retries: 30

  # -------------------------------------------------------------------------
  # Data Mates — 화면과 API. dbt 프로젝트 파일을 **쓰는** 쪽이다.
  #
  # airflow 와 **같은 이미지**를 다른 command 로 돌린다. 이 앱이 dbt 를 서브프로세스로
  # 부르므로(parse·seed·test) 양쪽의 dbt 가 반드시 같은 버전이어야 하는데, 이미지가
  # 하나면 그게 구조적으로 보장된다 — 같은 프로젝트를 여기서는 parse, 저기서는 build
  # 하므로 버전이 갈리면 manifest 가 조용히 틀어진다.
  #
  # entrypoint 를 덮는 이유: 베이스의 /entrypoint 는 airflow 하위 명령을 해석하는
  # 스크립트라 uvicorn 을 그대로 넘길 수 없다. dumb-init 은 남긴다 — dbt 를 호출마다
  # 새로 띄우는 구조라 PID 1 이 좀비를 거두지 않으면 쌓인다.
  #
  # 호스트에서 띄우려면 이 서비스를 멈추고 ./datamates/run.sh 를 쓴다. 그때는 아래
  # 주소들이 전부 localhost 이고 DATAMATES_CONTAINER_API 는 host.docker.internal 이다
  # (config.py 의 기본값). 두 방식을 섞어 쓸 수 있다 — 생성되는 DAG 은 앱이 기동할 때
  # 자기 기준으로 다시 쓴다.
  # -------------------------------------------------------------------------
  datamates:
    image: *image
    entrypoint: ["/usr/bin/dumb-init", "--"]
    command: ["/opt/datamates-venv/bin/uvicorn", "datamates.app.main:app",
              "--host", "0.0.0.0", "--port", "8000"]
    # 이미지의 WORKDIR 은 베이스를 따라 /opt/airflow 다(airflow 서비스가 그래야 한다).
    # 이 서비스는 저장소 루트에서 떠야 uvicorn 이 datamates 패키지를 찾는다.
    working_dir: /opt/project
    # 이미지에 굽지 않는다 — 한 이미지가 세 역할을 하므로 확인할 것이 서비스마다 다르다.
    # curl 대신 앱 venv 의 httpx 를 쓴다(의존성이 이미 있다). Airflow 가 죽어 있어도
    # /health 는 200 을 주므로 «앱은 살아 있고 Airflow 만 없다» 를 구분할 수 있다.
    healthcheck:
      test: ["CMD", "/opt/datamates-venv/bin/python", "-c",
             "import httpx; httpx.get('http://localhost:8000/api/v1/health', timeout=4).raise_for_status()"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5
    container_name: datamates
    depends_on:
      minio:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
      # DuckLake 카탈로그. 없으면 미리보기·이력이 통째로 503 이다.
      postgres:
        condition: service_healthy
      # 기동할 때 Iceberg 커밋용 풀을 만들고 admin 비밀번호를 읽는다.
      # Airflow 가 준비되기 전에 뜨면 그 둘이 실패한 채로 서비스가 산다.
      airflow:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # 컨테이너에서 본 이웃들. 호스트에서 띄울 때는 전부 localhost 다.
      AIRFLOW_BASE_URL: http://airflow:8080
      ICEBERG_REST_URI: http://iceberg-rest:8181
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

      # Superset 은 같은 compose 프로젝트(datamates)라 서비스 이름으로 닿는다.
      # docker-compose.superset.yml 을 함께 넘기지 않으면 분석 화면만 응답하지 못한다
      # — 호스트 실행일 때의 localhost:8088 과 같은 성질의 제약이다.
      SUPERSET_BASE_URL: http://superset:8088

      # 생성되는 DAG 파일에 그대로 박히는 주소다. 수집 DAG 이 이 주소로 적재를 요청한다
      # (적재 엔진 pyiceberg 는 API 쪽에만 있다). 앱이 호스트에 있을 때는
      # host.docker.internal:8000 이지만, 같은 네트워크에 들어왔으니 서비스 이름을 쓴다.
      DATAMATES_CONTAINER_API: http://datamates:8000/api/v1

      # dbt 프로젝트는 이 저장소 밖에 있을 수 있다. 아래 volumes 가 호스트의 실제 위치를
      # 컨테이너의 이 자리에 걸어 주고, config.py 의 DBT_DIR 이 이 값을 읽는다.
      DBT_PROJECT_DIR: /opt/project/dbt
      DBT_PROFILES_DIR: /opt/project/dbt/profiles
      DBT_SCHEMA: analytics
      DBT_TARGET: local
      # DBT_TARGET_PATH 를 airflow 처럼 컨테이너 안으로 돌리면 안 된다. 앱이 자기가 만든
      # manifest.json 을 프로젝트의 target/ 에서 읽어 카탈로그·계보를 그리므로,
      # 쓰는 곳과 읽는 곳이 갈리면 화면이 빈다.
      #
      # DuckLake 카탈로그. airflow 와 같은 값을 봐야 한다 — dbt 가 쓴 스냅샷을
      # warehouse.py·ingest.py 가 같은 카탈로그에서 읽는다(config.py 의 dbt_env 참고).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-datamates}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datamates}
    volumes:
      # 읽기쓰기다. airflow 쪽이 :ro 인 것과 대비되는 지점 — 파일을 쓰는 주체가 여기다.
      # 화면에서 만든 DAG 과 메타스토어가 저장소에 남아야 git 으로 관리된다.
      - ./:/opt/project
      # dbt 프로젝트도 읽기쓰기로 건다. 모델을 저장한다는 것이 곧 이 디렉터리에
      # .sql 과 schema.yml 을 쓰는 일이므로 :ro 면 화면의 저장이 전부 실패한다.
      - ${DBT_PROJECT_DIR:-./dbt}:/opt/project/dbt
      # Airflow 가 만든 admin 비밀번호 파일을 읽기 위해 홈을 읽기전용으로 건다.
      # 컨테이너 안에는 docker CLI 가 없어서 docker exec 로 읽을 수 없다.
      - airflow-home:/opt/airflow:ro

volumes:
  minio-data:
  airflow-home:
  # ivy-cache · spark-events 는 Spark(dbt-spark) 전용이었다. DuckLake 이관으로
  # Airflow 가 JVM 을 띄우지 않으므로 마운트하지 않는다. 롤백 시 되살릴 것.
  postgres-data:
  # 카탈로그가 SQLite 였을 때 쓰던 볼륨. Postgres 로 옮긴 뒤에도 남겨 둔다 —
  # 이관이 잘못됐을 때 되돌릴 유일한 원본이고, 40KB 라 지울 이유가 없다.
  # 마운트하는 서비스는 이제 없다.
  #   docker run --rm -v iceberg-catalog:/c alpine cat /c/catalog.db > catalog.db
  iceberg-catalog:
    external: true
